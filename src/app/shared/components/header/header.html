<nav class="navbar bg-body-tertiary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/" (click)="closeMenu()">Offcanvas navbar</a>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="btn btn-link nav-link p-0 d-flex align-items-center gap-2 text-body-emphasis" type="button"
        aria-label="Toggle dark mode" [attr.aria-pressed]="isDarkMode() === 'dark'" (click)="toggleTheme()">
        <span aria-hidden="true">{{ isDarkMode() === 'dark' ? '☀️' : '🌙' }}</span>
        <span>{{ isDarkMode() === 'dark' ? 'Light' : 'Dark' }}</span>
      </button>

      <button class="navbar-toggler" type="button" (click)="toggleMenu()" aria-controls="offcanvasNavbar"
        [attr.aria-expanded]="!isMenuCollapsed()" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel"
      [class.show]="!isMenuCollapsed()">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Offcanvas</h5>
        <button type="button" class="btn-close" (click)="toggleMenu()" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" routerLink="/" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
          </li>

          @if (authService.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/auth/login" routerLinkActive="active" (click)="closeMenu()">Products</a>
          </li>
          }
        </ul>

        <form class="d-flex mt-3" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </div>
</nav>

@if (!isMenuCollapsed()) {
<div class="offcanvas-backdrop fade show" (click)="closeMenu()"></div>
}
