<div class="container mt-5" style="max-width: 420px;">
  <div class="card shadow border-0 rounded-3">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4 text-primary fw-bold">تسجيل الدخول</h3>

      @if (error()) {
      <div class="alert alert-danger py-2" role="alert">
        {{ error() }}
      </div>
      }

      <form (submit)="onLogin($event)">
        <div class="mb-3">
          <label class="form-label fw-semibold">اسم المستخدم</label>
          <input type="text" class="form-control" [formField]="loginForm.username" placeholder="أدخل اسم المستخدم" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">كلمة المرور</label>
          <input type="password" class="form-control" [formField]="loginForm.password" placeholder="••••••••" />
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold" [disabled]="loading()">
          @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          جاري التحقق...
          } @else {
          دخول
          }
        </button>
      </form>
    </div>
  </div>
</div>
