<p>login works!</p>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              
              <h3 class="card-title text-center mb-2">تسجيل الدخول</h3>
              <p class="text-muted text-center small mb-4">
                للتجربة: <code>emilys</code> / <code>emilyspass</code>
              </p>

              @if (error()) {
                <div class="alert alert-danger py-2 small" role="alert">
                  {{ error() }}
                </div>
              }

              <form (ngSubmit)="onLogin()">
                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold">اسم المستخدم</label>
                  <input
                    id="username"
                    type="text"
                    class="form-control"
                    [value]="username"
                    (input)="username = $any($event.target).value"
                    name="username"
                    placeholder="username"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold">كلمة المرور</label>
                  <input
                    id="password"
                    type="password"
                    class="form-control"
                    [value]="password"
                    (input)="password = $any($event.target).value"
                    name="password"
                    placeholder="password"
                    required
                  />
                </div>

                <button 
                  type="submit" 
                  class="btn btn-primary w-100 py-2 fw-bold" 
                  [disabled]="loading()">
                  
                  @if (loading()) {
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    جاري التحقق...
                  } @else {
                    دخول
                  }
                </button>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
